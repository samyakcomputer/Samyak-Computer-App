
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Samyak WhatsApp Sender</title>
<style>
body{font-family:Arial,sans-serif;background:#f0f4f1;margin:0;padding:18px}
main{max-width:650px;margin:auto;background:white;padding:22px;border-radius:16px}
h1{color:#128044;font-size:26px}
label{display:block;font-weight:bold;margin:18px 0 8px}
textarea{box-sizing:border-box;width:100%;padding:12px;border:1px solid #bbb;border-radius:9px;font-size:16px}
#msg{height:120px}#nums{height:180px}
button{width:100%;padding:14px;margin-top:12px;border:0;border-radius:9px;background:#168346;color:white;font-size:16px;font-weight:bold}
.secondary{background:#e6eee8;color:#164d2c}
#status{white-space:pre-wrap;line-height:1.6;margin-top:16px}
small{color:#555}
</style>
</head>
<body>
<main>
<h1>Samyak WhatsApp Sender</h1>
<p>Samyak Computer Classes के बच्चों को मैसेज भेजें।</p>

<label for="msg">1. अपना मैसेज लिखें</label>
<textarea id="msg" placeholder="बच्चों के लिए मैसेज यहाँ लिखें..."></textarea>

<label for="nums">2. मोबाइल नंबर डालें</label>
<textarea id="nums" placeholder="एक लाइन में एक नंबर लिखें:
9876543210
919876543211"></textarea>
<small>भारत के 10 अंकों वाले नंबर या 91 सहित नंबर डालें।</small>

<button onclick="start()">पहला WhatsApp खोलें</button>
<button class="secondary" onclick="next()">अगला नंबर खोलें</button>
<button class="secondary" onclick="resetList()">फिर से शुरू करें</button>

<div id="status">अभी कोई मैसेज नहीं भेजा गया है।</div>
</main>

<script>
let list = [];
let index = 0;

function prepare() {
  const msg = document.getElementById("msg").value.trim();
  const raw = document.getElementById("nums").value
    .split(/\n|,|;/)
    .map(s => s.trim())
    .filter(Boolean);

  if (!msg) {
    alert("पहले मैसेज लिखें।");
    return false;
  }
  if (!raw.length) {
    alert("मोबाइल नंबर डालें।");
    return false;
  }
  if (raw.length > 500) {
    alert("एक बार में अधिकतम 500 नंबर डालें।");
    return false;
  }

  list = [];
  for (const item of raw) {
    let n = item.replace(/[\s()+-]/g, "");
    if (/^\d{10}$/.test(n)) n = "91" + n;
    if (!/^[1-9]\d{7,14}$/.test(n)) {
      alert("यह नंबर सही नहीं है: " + item);
      return false;
    }
    list.push(n);
  }

  list = [...new Set(list)];
  index = 0;
  return true;
}

function openCurrent() {
  if (index >= list.length) {
    document.getElementById("status").textContent =
      "सूची पूरी हो गई। सभी नंबरों की जाँच कर लें।";
    return;
  }

  const msg = document.getElementById("msg").value.trim();
  const url = "https://wa.me/" + list[index] +
    "?text=" + encodeURIComponent(msg);

  document.getElementById("status").textContent =
    "नंबर " + (index + 1) + " / " + list.length +
    "\nखोला गया नंबर: " + list[index] +
    "\nWhatsApp में मैसेज देखकर Send दबाएँ। फिर वापस आकर अगला नंबर खोलें।";

  window.open(url, "_blank");
}

function start() {
  if (!prepare()) return;
  openCurrent();
}

function next() {
  if (!list.length) {
    alert("पहले पहला WhatsApp खोलें।");
    return;
  }
  index++;
  openCurrent();
}

function resetList() {
  list = [];
  index = 0;
  document.getElementById("status").textContent =
    "सूची रीसेट हो गई।";
}
</script>
</body>
</html>
